appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-network-drop-resume
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-network-drop-resume
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: network-drop-resume:success.*'
    timeout: 90000

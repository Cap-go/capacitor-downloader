appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: background-complete
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: background-complete
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: '.*PHASE:background-complete:downloading.*'
    timeout: 90000
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
- launchApp:
    clearState: false
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '.*Marker: background-complete:success.*'
    timeout: 90000

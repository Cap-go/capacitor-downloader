appId: app.capgo.downloader
---
- launchApp
- extendedWaitUntil:
    visible:
      id: maestro-status
      text: maestroReady
    timeout: 60000
- tapOn: Maestro iOS batch fail
- extendedWaitUntil:
    visible:
      id: maestro-status
      text: '.*maestroRunning:.*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: '.*Provide either url and destination or files, not both.*'
    timeout: 15000
- assertVisible:
    text: '.*Error:.*Provide either url and destination or files, not both.*'
appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: foreground-complete
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    text: foreground-complete
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: foreground-complete:success.*'
    timeout: 300000

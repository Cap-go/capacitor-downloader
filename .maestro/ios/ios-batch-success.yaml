appId: app.capgo.downloader
---
- launchApp
- tapOn: Maestro iOS batch
- extendedWaitUntil:
    visible:
      text: '"maestroBatchComplete": true'
    timeout: 120000
- assertVisible:
    text: '"downloadCompleted": true'
- assertVisible:
    text: '"allFilesDone": true'
- assertVisible:
    text: '"allFileSizesVerified": true'
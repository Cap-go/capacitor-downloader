<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />


    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
<title>@capgo/capacitor-downloader</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>@capgo/capacitor-downloader</h1>
      <p class="lead">Run native plugin APIs with the source linked locally.</p>
      <section id="maestro-panel" class="hidden">
        <p id="harness-ready">Harness: booting</p>
        <p id="e2e-summary">Harness: booting</p>
        <div id="e2e-flow-buttons" class="form-grid"></div>
        <pre id="e2e-log"></pre>
      </section>
      <section id="manual-panel">
        <label for="action-select">Available actions</label>
        <select id="action-select"></select>
        <div id="action-description" class="action-description"></div>
        <div id="action-form" class="form-grid"></div>
        <button id="run-action">Run action</button>
        <pre id="plugin-output">Select an action to begin.</pre>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

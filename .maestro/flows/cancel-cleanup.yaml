appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-cancel-cleanup
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: e2e-flow-cancel-cleanup
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: cancel-cleanup:success.*'
    timeout: 120000

appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: error-unwritable-destination
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: error-unwritable-destination
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: error-unwritable-destination:success.*'
    timeout: 60000

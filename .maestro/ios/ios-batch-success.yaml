appId: app.capgo.downloader
---
- launchApp
- tapOn: Maestro iOS batch
- extendedWaitUntil:
    visible:
      text: maestroBatchComplete
    timeout: 120000
- assertVisible:
    text: allFileSizesVerified
- assertVisible:
    text: downloadCompleted
- assertVisible:
    text: allFilesDone
- assertVisible:
    text: '"done": true'
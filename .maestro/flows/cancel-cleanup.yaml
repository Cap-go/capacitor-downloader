appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: cancel-cleanup
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: cancel-cleanup
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*STATE:cancel-me:(?!DONE).*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Marker: cancel-cleanup:success.*'
    timeout: 90000

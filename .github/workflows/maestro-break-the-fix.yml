name: Maestro break-the-fix validation

on:
  push:
    branches:
      - cursor/maestro-e2e-suite-f5f5
    paths:
      - .github/workflows/maestro-break-the-fix.yml
      - scripts/maestro/**
      - .maestro/flows/**
      - example-app/src/maestro-harness.js
      - ios/**
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Regression scenario (or all matrix jobs)'
        required: true
        type: choice
        options:
          - all
          - completion-once
          - cancel-cleanup
          - error-404
      mode:
        description: 'broken = expect Maestro FAIL, fixed = expect PASS'
        required: true
        type: choice
        options:
          - broken
          - fixed
          - both

concurrency:
  # One matrix per push; do not cancel an in-flight run when another push lands on the branch.
  group: maestro-break-the-fix-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2
  MAESTRO_VERSION: cli-2.4.0

jobs:
  break_fix_plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android_matrix: ${{ steps.plan.outputs.android_matrix }}
      ios_matrix: ${{ steps.plan.outputs.ios_matrix }}
      android_enabled: ${{ steps.plan.outputs.android_enabled }}
      ios_enabled: ${{ steps.plan.outputs.ios_enabled }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: break-fix-plan
          dependency-cache-path: node_modules
      - name: Build break-the-fix matrix
        id: plan
        env:
          SCENARIO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scenario || 'all' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'both' }}
        run: bun scripts/maestro/break-fix-matrix.mjs

  break_fix_android:
    name: break-fix android / ${{ matrix.regression }} / ${{ matrix.mode }}
    needs: break_fix_plan
    if: needs.break_fix_plan.outputs.android_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.break_fix_plan.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: break-fix-android-${{ matrix.regression }}-${{ matrix.mode }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run break-the-fix scenario
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            echo "BREAK_THE_FIX regression=${{ matrix.regression }} mode=${{ matrix.mode }} flow=${{ matrix.flow }}";
            bash ./scripts/maestro/run-break-fix-scenario.sh
            ${{ matrix.regression }}
            ${{ matrix.flow }}
            android
            ${{ matrix.mode }}
      - name: Verify expected outcome
        run: |
          echo "BREAK_THE_FIX_RESULT regression=${{ matrix.regression }} mode=${{ matrix.mode }} maestro_exit=${{ steps.run.outcome }}"
          if [[ ! -d maestro-results ]] || [[ -z "$(find maestro-results -type f -print -quit 2>/dev/null)" ]]; then
            echo "Missing Maestro Android results (build/install likely failed before the flow ran)"
            exit 1
          fi
          if [[ "${{ steps.run.outcome }}" != "${{ matrix.expect_outcome }}" ]]; then
            echo "Expected ${{ matrix.expect_outcome }} but got ${{ steps.run.outcome }}"
            exit 1
          fi
          if [[ "${{ matrix.mode }}" == "broken" ]]; then
            echo "PASS: Maestro FAILED as expected with regression applied"
          else
            echo "PASS: Maestro PASSED with regression reverted"
          fi
      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: break-fix-android-${{ matrix.regression }}-${{ matrix.mode }}
          path: |
            maestro-results
            .maestro-artifacts

  break_fix_build_ios:
    name: break-fix build ios / ${{ matrix.regression }} / ${{ matrix.mode }}
    needs: break_fix_plan
    if: needs.break_fix_plan.outputs.ios_enabled == 'true'
    runs-on: macOS-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.break_fix_plan.outputs.ios_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: break-fix-ios-build-${{ matrix.regression }}-${{ matrix.mode }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Cache iOS DerivedData for break-fix builds
        uses: actions/cache@v5
        with:
          path: .maestro-ios-derived-data
          key: maestro-ios-derived-${{ runner.os }}-${{ hashFiles('example-app/ios/**', 'ios/**', 'example-app/bun.lock', 'Package.swift', 'android/**') }}
      - name: Build iOS app for matrix variant
        env:
          CAPGO_MAESTRO_IOS_DERIVED_DATA: ${{ github.workspace }}/.maestro-ios-derived-data
        run: |
          bash ./scripts/maestro/build-break-fix-ios-app.sh ${{ matrix.regression }} ${{ matrix.mode }}
      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v7
        with:
          name: break-fix-ios-app-${{ matrix.regression }}-${{ matrix.mode }}
          path: break-fix-ios-app.tar.gz
          if-no-files-found: error

  break_fix_ios:
    name: break-fix ios / ${{ matrix.regression }} / ${{ matrix.mode }}
    needs:
      - break_fix_plan
      - break_fix_build_ios
    if: needs.break_fix_plan.outputs.ios_enabled == 'true'
    runs-on: macOS-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.break_fix_plan.outputs.ios_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: break-fix-ios-${{ matrix.regression }}-${{ matrix.mode }}
          dependency-cache-path: node_modules
      - name: Download prebuilt iOS app
        uses: actions/download-artifact@v8
        with:
          name: break-fix-ios-app-${{ matrix.regression }}-${{ matrix.mode }}
      - name: Extract iOS app
        run: |
          mkdir -p maestro-ios-app
          tar -xzf break-fix-ios-app.tar.gz -C maestro-ios-app
      - name: Select iOS simulator
        run: |
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Run break-the-fix scenario
        id: run
        continue-on-error: true
        env:
          CAPGO_MAESTRO_IOS_SIMULATOR_ID: ${{ env.CAPGO_MAESTRO_IOS_SIMULATOR_ID }}
          CAPGO_MAESTRO_BREAK_FIX_MAESTRO_ONLY: '1'
          CAPGO_MAESTRO_IOS_APP_PATH: maestro-ios-app/App.app
        run: |
          echo "BREAK_THE_FIX regression=${{ matrix.regression }} mode=${{ matrix.mode }} flow=${{ matrix.flow }}"
          bash ./scripts/maestro/run-break-fix-scenario.sh ${{ matrix.regression }} ${{ matrix.flow }} ios ${{ matrix.mode }}
      - name: Verify expected outcome
        run: |
          echo "BREAK_THE_FIX_RESULT regression=${{ matrix.regression }} mode=${{ matrix.mode }} maestro_exit=${{ steps.run.outcome }}"
          if [[ ! -d maestro-results-ios ]] || [[ -z "$(find maestro-results-ios -type f -print -quit 2>/dev/null)" ]]; then
            echo "Missing Maestro iOS results (build/install likely failed before the flow ran)"
            exit 1
          fi
          if [[ "${{ steps.run.outcome }}" != "${{ matrix.expect_outcome }}" ]]; then
            echo "Expected ${{ matrix.expect_outcome }} but got ${{ steps.run.outcome }}"
            exit 1
          fi
          if [[ "${{ matrix.mode }}" == "broken" ]]; then
            echo "PASS: Maestro FAILED as expected with regression applied"
          else
            echo "PASS: Maestro PASSED with regression reverted"
          fi
      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: break-fix-ios-${{ matrix.regression }}-${{ matrix.mode }}
          path: |
            maestro-results-ios
            .maestro-artifacts
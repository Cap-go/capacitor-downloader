appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: batch-error-404
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    text: batch-error-404
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: batch-error-404:success.*'
    timeout: 150000
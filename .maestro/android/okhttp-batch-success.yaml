appId: app.capgo.downloader
---
- launchApp
- extendedWaitUntil:
    visible:
      text: '.*maestroReady.*'
    timeout: 60000
- tapOn: Maestro OkHttp batch
- extendedWaitUntil:
    visible:
      text: '.*maestroRunning:.*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: '.*"maestroHarnessDone": ?true.*'
    timeout: 120000
- assertVisible:
    text: '.*"maestroBatchComplete": ?true.*'
- assertVisible:
    text: '.*"allFileSizesVerified": ?true.*'
- assertVisible:
    text: '.*"downloadCompleted": ?true.*'
- assertVisible:
    text: '.*"allFilesDone": ?true.*'
- assertVisible:
    text: '.*"allChildrenCompleted": ?true.*'
- assertVisible:
    text: '.*COMPLETED.*'
name: Build source code and test it

concurrency:
  group: build-source-code-and-test-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches: [ main ]
  workflow_call: # release path: called by Build and publish on version tags

env:
  BUN_VERSION: 1.4.2
  MAESTRO_VERSION: cli-2.4.0
  CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192

jobs:
  guard_swiftpm_version:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in Package.swift"
            exit 1
          fi
  build_android:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Build
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh android
  build_ios:
    runs-on: macOS-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh ios
  web:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    name: 'Build code and test'
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Lint
        id: lint_code
        run: bun run lint
      - name: Verify packed package in example app (Web)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh web
      - name: Verify
        id: verify_code
        run: bun run verify:web
      - name: Check Maestro fake server lifecycle
        run: bash scripts/maestro/test-server-lifecycle.sh

  maestro_build_android_app:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Maestro Android app
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Build Android Maestro example app
        env:
          CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192
        run: bun scripts/maestro/prepare-maestro-app.mjs android
      - name: Upload Android Maestro app
        uses: actions/upload-artifact@v7
        with:
          name: maestro-downloader-android-app
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  maestro_build_ios_app:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build Maestro iOS app
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Cache iOS DerivedData for Maestro app
        uses: actions/cache@v5
        with:
          path: .maestro-ios-derived-data
          key: maestro-ios-derived-${{ runner.os }}-${{ hashFiles('example-app/ios/**', 'ios/**', 'example-app/bun.lock', 'Package.swift') }}
      - name: Build iOS Maestro example app
        env:
          CAPGO_MAESTRO_IOS_DERIVED_DATA: ${{ github.workspace }}/.maestro-ios-derived-data
          CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192
        run: bun scripts/maestro/prepare-maestro-app.mjs ios
      - name: Package iOS app
        run: |
          APP_PATH="${GITHUB_WORKSPACE}/.maestro-ios-derived-data/Build/Products/Debug-iphonesimulator/App.app"
          mkdir -p maestro-ios-app
          ditto "$APP_PATH" maestro-ios-app/App.app
          tar -czf maestro-ios-app.tar.gz -C maestro-ios-app App.app
      - name: Install Maestro CLI for E2E matrix
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Package iOS Maestro E2E bundle
        run: |
          mkdir -p maestro-ios-e2e-bundle/App.app maestro-ios-e2e-bundle/maestro-cli
          ditto maestro-ios-app/App.app maestro-ios-e2e-bundle/App.app
          ditto "$HOME/.maestro/." maestro-ios-e2e-bundle/maestro-cli
          tar -czf maestro-ios-e2e-bundle.tar.gz -C maestro-ios-e2e-bundle .
      - name: Upload iOS Maestro E2E bundle
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-e2e-bundle
          path: maestro-ios-e2e-bundle.tar.gz
          if-no-files-found: error

  maestro_e2e_android:
    permissions:
      contents: read
    needs:
      - maestro_build_android_app
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Maestro E2E Android
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-maestro-android-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download Android Maestro app
        uses: actions/download-artifact@v8
        with:
          name: maestro-downloader-android-app
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run Maestro E2E (parallel shards)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -read-only
          script: >-
            CAPGO_MAESTRO_SHARD_COUNT=1
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_TIMEOUT_SECONDS=480
            CAPGO_MAESTRO_TEST_RETRIES=1
            MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
            ./scripts/test-maestro-downloader-android-parallel.sh
      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-android
          path: maestro-results

  maestro_e2e_ios:
    permissions:
      contents: read
    needs:
      - maestro_build_ios_app
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Maestro E2E iOS
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-maestro-ios-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Download iOS Maestro E2E bundle
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-e2e-bundle
          path: .
      - name: Extract iOS Maestro E2E bundle
        run: |
          mkdir -p maestro-ios-app maestro-cli
          tar -xzf maestro-ios-e2e-bundle.tar.gz -C .
          rm -rf "$HOME/.maestro"
          mkdir -p "$HOME/.maestro"
          ditto maestro-cli/ "$HOME/.maestro/"
          chmod 0755 "$HOME/.maestro/bin/maestro"
          mv App.app maestro-ios-app/App.app
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro E2E (parallel simulator shards)
        env:
          CAPGO_MAESTRO_IOS_APP_PATH: maestro-ios-app/App.app
          CAPGO_MAESTRO_SHARD_COUNT: 4
          CAPGO_MAESTRO_TIMEOUT_SECONDS: 300
          CAPGO_MAESTRO_TEST_RETRIES: 2
          CAPGO_MAESTRO_LIGHT_RETRY_SLEEP_SECONDS: 2
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: ./scripts/test-maestro-downloader-ios-parallel.sh
      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios
          path: maestro-results-ios

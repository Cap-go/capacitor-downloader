appId: app.capgo.downloader
---
- launchApp
- extendedWaitUntil:
    visible:
      id: maestro-status
      text: maestroReady
    timeout: 60000
- tapOn: Maestro mixed-engine batch
- extendedWaitUntil:
    visible:
      id: maestro-status
      text: '.*maestroRunning:.*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: '.*All files of a batch must resolve to the same Android HTTP engine.*'
    timeout: 15000
- assertVisible:
    text: '.*Error:.*All files of a batch must resolve to the same Android HTTP engine.*'
appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: error-404
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    text: error-404
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: error-404:success.*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Marker: error-404:success.*'
    timeout: 90000

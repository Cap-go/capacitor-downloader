appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-background-complete
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-background-complete
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*PHASE:background-complete:downloading.*'
    timeout: 45000
- pressKey: Home
- extendedWaitUntil:
    visible: '.*'
    timeout: 5000
- launchApp:
    clearState: false
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '.*Marker: background-complete:success.*'
    timeout: 120000

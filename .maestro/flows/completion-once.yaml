appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-completion-once
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: e2e-flow-completion-once
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: completion-once:success.*'
    timeout: 120000

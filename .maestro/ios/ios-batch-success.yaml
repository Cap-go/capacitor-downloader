appId: app.capgo.downloader
---
- launchApp
- tapOn:
    id: maestro-ios-batch
- extendedWaitUntil:
    visible:
      text: '"maestroBatchComplete": true'
    timeout: 120000
- assertVisible:
    id: plugin-output
- assertVisible:
    text: '"downloadCompleted": true'
- assertVisible:
    text: '"allFilesDone": true'
- assertVisible:
    text: '"sizeOnDisk"'
- assertVisible:
    text: '"done": true'
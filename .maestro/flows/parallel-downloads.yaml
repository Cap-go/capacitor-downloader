appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      id: e2e-flow-parallel-downloads
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: e2e-flow-parallel-downloads
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: parallel-downloads:success.*'
    timeout: 90000

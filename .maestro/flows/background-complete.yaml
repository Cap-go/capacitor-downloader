appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: background-complete
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    text: background-complete
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*PHASE:background-complete:downloading.*'
    timeout: 60000
- pressKey: Home
- extendedWaitUntil:
    visible: '.*'
    timeout: 10000
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: '.*Marker: background-complete:success.*'
    timeout: 240000

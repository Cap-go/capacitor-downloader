appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: completion-once
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    text: completion-once
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: completion-once:success.*'
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Marker: completion-once:success.*'
    timeout: 120000

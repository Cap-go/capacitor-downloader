appId: app.capgo.downloader
---
- runFlow: ../helpers/launch-harness.yaml
- scrollUntilVisible:
    element:
      text: parallel-downloads
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    text: parallel-downloads
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*Marker: parallel-downloads:success.*'
    timeout: 180000
- extendedWaitUntil:
    visible: '.*Marker: parallel-downloads:success.*'
    timeout: 180000
